<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Hofflohmarkt Anmeldung</title>
  </head>
  <body>
    <h1>Hofflohmarkt Herbst 2026 – Anmeldung</h1>

    <form action="https://cimdata.app.n8n.cloud/webhook/hofflohmarkt-anmeldung" method="post">
      <label>Vorname:</label><br>
      <input type="text" name="vorname" required><br><br>
      
      <label>Nachname:</label><br>
      <input type="text" name="nachname" required><br><br>

      <label>Straße:</label><br>
      <input type="text" name="straße" required><br><br>

      <label>Hausnummer:</label><br>
<input 
  type="text" 
  name="hausnummer" 
  required 
  pattern="[0-9]+[a-zA-Z0-9/-]*"
  title="Bitte eine gültige Hausnummer eingeben, z.B. 8a, 12B, 3-5 oder 7/2."
><br><br>

      <label>Email:</label><br>
      <input type="email" name="email" required><br><br>

      <button type="submit">Anmelden</button>
    </form>
  </body>
</html>
